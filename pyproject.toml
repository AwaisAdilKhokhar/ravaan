[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ravaan"
version = "0.1.0"
description = "Does masked diffusion pay off for a genuinely low-resource language? A matched AR/diffusion comparison for Urdu."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Awais Bin Adil" }]
keywords = ["urdu", "language-model", "masked-diffusion", "low-resource", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Stages 1, 2 and 4 of the corpus pipeline (acquisition, encoding validation,
# normalization) need nothing but the standard library, on purpose: they decide
# which bytes the project is built on and what every later stage reads, so they
# should stay auditable and dependency-free. `[data]` starts at stage 3, where
# parquet has to be parsed.
dependencies = []

[project.scripts]
ravaan-acquire = "ravaan.data.acquisition:main"
ravaan-validate-encoding = "ravaan.data.encoding:main"
ravaan-normalize = "ravaan.data.normalization:main"

[project.optional-dependencies]
data = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
    "zstandard>=0.23",
    "tqdm>=4.66",
]
tokenizer = ["sentencepiece>=0.2.0"]
train = ["torch>=2.4", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ravaan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
