[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ravaan"
version = "0.1.0"
description = "Does masked diffusion pay off for a genuinely low-resource language? A matched AR/diffusion comparison for Urdu."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Awais Bin Adil" }]
keywords = ["urdu", "language-model", "masked-diffusion", "low-resource", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Stages 1-7 of the corpus pipeline (acquisition, encoding validation, language
# ID, normalization, quality filtering, exact and near dedup) need nothing but
# standard library, on purpose: they decide which bytes the project is built on
# and what every later stage reads, so they should stay auditable and
# dependency-free. `[data]` is needed only to *read* the corpus —
# `ravaan.data.shards` parses parquet — not to decide anything about it.
dependencies = []

[project.scripts]
ravaan-acquire = "ravaan.data.acquisition:main"
ravaan-decontaminate = "ravaan.data.decontamination:main"
ravaan-dedup = "ravaan.data.dedup:main"
ravaan-validate-encoding = "ravaan.data.encoding:main"
ravaan-langid = "ravaan.data.langid:main"
ravaan-minhash = "ravaan.data.minhash:main"
ravaan-normalize = "ravaan.data.normalization:main"
ravaan-pack = "ravaan.data.packing:main"
ravaan-pii = "ravaan.data.pii:main"
ravaan-quality = "ravaan.data.quality:main"
ravaan-splits = "ravaan.data.splits:main"
ravaan-shards = "ravaan.data.shards:main"

[project.optional-dependencies]
data = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
    "zstandard>=0.23",
    "tqdm>=4.66",
]
tokenizer = ["sentencepiece>=0.2.0"]
train = ["torch>=2.4", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ravaan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `scripts/` is drivers, not a distributed package — `packages.find` deliberately ships only
# `ravaan*`. But Finding W's lesson is that this repo's bugs live in the drivers, so the drivers
# have tests, and those tests have to be able to import them. Without this the suite passes
# locally off a stale editable install and fails on a clean checkout, which is exactly what CI
# caught the first time it ever ran.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `release_assets/` is vendored *for publication* — these files are uploaded verbatim to the
# Hugging Face repos, where they run outside this package. Each one calls `sys.path.insert`
# before importing `ravaan_infer`, so sorting the import block (I001) would hoist the imports
# above the path setup and break the file for everyone who downloaded it. The published copy
# and the copy here must not drift for a cosmetic rule.
"release_assets/*.py" = ["I001"]
